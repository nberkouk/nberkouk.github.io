<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="icon" type="image/png" href="/photo_circle.png">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url | remove: 'index.html' }}">
    <meta property="og:image" content="{{ site.url }}/photo_circle.png">
    <!-- Link to the main stylesheet -->
    <link rel="stylesheet" type="text/css" href="/css/main.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <img class="profile-photo" src="/photo_circle.png" alt="Nicolas Berkouk">
            <div class="header-text">
                <h1><a href="/index.html">Nicolas Berkouk</a></h1>
                <p class="subtitle">Scientific Lead · CNIL (French DPA) — AI Department</p>
                <nav class="main-nav">
                    <ul>
                        <li><a href="/index.html" class="{% if page.url == '/index.html' %}active{% endif %}">Home</a></li>
                        <li><a href="/research.html" class="{% if page.url == '/research.html' %}active{% endif %}">Research</a></li>
                        <li><a href="/projects.html" class="{% if page.url == '/projects.html' %}active{% endif %}">Projects</a></li>
                        <li><a href="/teaching.html" class="{% if page.url == '/teaching.html' %}active{% endif %}">Teaching</a></li>
                        <li><a href="/curriculum.html" class="{% if page.url == '/curriculum.html' %}active{% endif %}">CV</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="page">
        {{ content }}
    </main>

    <footer class="site-footer">
        <ul>
            <li><a href="mailto:firstsurnameletter+name@cnil.fr">Email</a></li>
            <li><a href="https://github.com/nberkouk">Github</a></li>
            <li><a href="https://scholar.google.fr/citations?user=nxkO-kIAAAAJ&hl=fr">Google Scholar</a></li>
        </ul>
    </footer>

</body>
</html>
